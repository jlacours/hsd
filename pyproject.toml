[project]
name = "hsd"
version = "0.1.0"
description = "HSD v2 — SQLite-backed task board with MCP tools, CLI, and web dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "click>=8.1.0",
    "markdown-it-py>=3.0.0",
    "httpx>=0.28.0",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
hsd = "hsd.cli:main"
hsd-mcp = "hsd.mcp.server:main"
hsd-web = "hsd.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
